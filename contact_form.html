<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #e9efff, #f8f5ff 55%, #e7f7f4);
      color: #1d2440;
      font-family: Arial, Helvetica, sans-serif;
    }

    .card {
      width: min(100%, 460px);
      padding: 34px;
      border: 1px solid #e7e9f2;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(41, 53, 100, 0.12);
    }

    .tag {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 999px;
      background: #eef0ff;
      color: #5146c8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 { margin: 16px 0 8px; font-size: 28px; }
    .intro { margin: 0 0 22px; color: #68708a; line-height: 1.5; }

    label {
      display: block;
      margin: 16px 0 7px;
      font-size: 14px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8dceb;
      border-radius: 9px;
      background: #fcfcff;
      color: #1d2440;
      font: inherit;
    }

    input:focus, textarea:focus {
      outline: 3px solid rgba(91, 80, 220, 0.15);
      border-color: #6559db;
    }

    textarea { resize: vertical; }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, #5146c8, #735be8);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.07); }

    .message {
      display: none;
      margin: 16px 0;
      padding: 12px;
      border: 1px solid #bce8d0;
      border-radius: 9px;
      background: #effbf4;
      color: #17643a;
    }

    .message.show { display: block; }

    @media (max-width: 500px) {
      .card { padding: 26px 20px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="tag">CONTACT FORM</div>
    <h1>Share your details</h1>
    <p class="intro">Please enter your name, phone number, and address.</p>

    <div id="successMessage" class="message" role="status"></div>

    <form id="contactForm">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" placeholder="Enter your name" required>

      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" placeholder="Enter your phone number" required>

      <label for="address">Address</label>
      <textarea id="address" name="address" rows="4" placeholder="Enter your address" required></textarea>

      <button type="submit">Submit</button>
    </form>
  </main>

  <script>
    const form = document.getElementById("contactForm");
    const successMessage = document.getElementById("successMessage");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const name = document.getElementById("name").value.trim();
      successMessage.textContent = name
        ? "Successfully submitted, " + name + "!"
        : "Successfully submitted!";
      successMessage.classList.add("show");

      form.reset();
    });
  </script>
</body>
</html>
